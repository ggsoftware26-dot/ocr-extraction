services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: ocr-extraction:latest
    restart: unless-stopped
    command: ['node', 'dist/main']
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - '3000'

  worker:
    image: ocr-extraction:latest
    restart: unless-stopped
    command: ['node', 'dist/worker']
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  ingest:
    image: ocr-extraction:latest
    restart: unless-stopped
    user: root
    entrypoint: ['/usr/local/bin/ingest-entrypoint.sh']
    command: ['node', 'dist/ingest']
    env_file: .env
    environment:
      NODE_ENV: production
      INGEST_PORT: '3001'
      INGEST_PUBLIC_URL: http://ingest:3001
      OCR_API_URL: http://api:3000
    volumes:
      - ingest-data:/app/data
    depends_on:
      api:
        condition: service_started
    expose:
      - '3001'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  redis-data:
  ingest-data:
  caddy-data:
  caddy-config:
