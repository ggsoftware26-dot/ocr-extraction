<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OCR Upload</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --queued: #6366f1;
      --radius: 14px;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .app {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1rem calc(1.5rem + var(--safe-bottom));
      min-width: 0;
    }

    header {
      margin-bottom: 1.25rem;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    header a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      margin-bottom: 1rem;
      min-width: 0;
      overflow: hidden;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--muted);
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
    }

    input:focus {
      outline: 2px solid rgba(37, 99, 235, 0.25);
      border-color: var(--accent);
    }

    .mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .mode-option {
      position: relative;
      cursor: pointer;
    }

    .mode-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-option span {
      display: block;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .mode-option small {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
    }

    .mode-option input:checked + span {
      border-color: var(--accent);
      background: #eff6ff;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .mode-option input:focus-visible + span {
      outline: 2px solid rgba(37, 99, 235, 0.35);
      outline-offset: 2px;
    }

    .nano-status {
      margin: -0.35rem 0 1rem;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      background: #f8fafc;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .nano-status.ok { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
    .nano-status.warn { background: #fffbeb; color: #92400e; border-color: #fde68a; }
    .nano-status.err { background: #fef2f2; color: #991b1b; border-color: #fecaca; }

    .api-key-block.hidden {
      display: none;
    }

    .dropzone {
      margin-top: 1rem;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 1.5rem 1rem;
      text-align: center;
      background: #f8fafc;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: #eff6ff;
    }

    .dropzone strong {
      display: block;
      margin-bottom: 0.25rem;
    }

    .dropzone span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .file-list {
      margin-top: 0.75rem;
      display: grid;
      gap: 0.5rem;
    }

    .file-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 0.9rem;
    }

    .file-chip-main {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
      flex: 1;
    }

    .file-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-chip button {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.2rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    button.primary {
      flex: 1;
      min-width: 140px;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button.primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.secondary {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      background: #fff;
      cursor: pointer;
    }

    .jobs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .jobs-header h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .jobs-header small {
      color: var(--muted);
    }

    .job-list {
      display: grid;
      gap: 0.75rem;
      min-width: 0;
    }

    .job-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem;
      background: #fff;
      min-width: 0;
      overflow: hidden;
    }

    .job-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-width: 0;
    }

    .job-body {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
      flex: 1;
    }

    .job-info {
      min-width: 0;
      flex: 1;
    }

    .thumb {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      background: #f1f5f9;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-doc {
      color: #dc2626;
      background: #fef2f2;
    }

    .thumb-doc svg {
      width: 30px;
      height: 30px;
    }

    .job-top > div:first-child {
      min-width: 0;
      flex: 1;
    }

    .job-name {
      font-weight: 600;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .job-meta {
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-all;
    }

    .badge {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      color: #fff;
    }

    .badge.queued { background: var(--queued); }
    .badge.processing { background: var(--warning); }
    .badge.completed { background: var(--success); }
    .badge.failed { background: var(--danger); }
    .badge.uploading { background: #475569; }

    .job-error {
      margin-top: 0.6rem;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      background: #fef2f2;
      color: #991b1b;
      font-size: 0.85rem;
    }

    .job-result {
      margin-top: 0.65rem;
      min-width: 0;
    }

    .job-result summary {
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }

    .result-panel {
      margin-top: 0.5rem;
      max-width: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }

    .job-result pre {
      margin: 0;
      padding: 0.65rem;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.72rem;
      line-height: 1.45;
      max-height: min(320px, 55vh);
      max-width: 100%;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      -webkit-overflow-scrolling: touch;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 1.5rem 0.5rem;
      font-size: 0.95rem;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(1rem + var(--safe-bottom));
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      max-width: calc(100vw - 2rem);
      z-index: 20;
    }

    .toast.show { opacity: 0.95; }

    @media (min-width: 640px) {
      .app { padding-top: 1.5rem; }
      header h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>OCR Extraction</h1>
      <p>Upload documents and track multiple jobs in parallel. <a href="/views/results.html">Browse stored results</a></p>
    </header>

    <section class="card">
      <label id="modeLabel">Extraction mode</label>
      <div class="mode-row" role="radiogroup" aria-labelledby="modeLabel">
        <label class="mode-option">
          <input type="radio" name="extractMode" value="cloud" checked />
          <span>Cloud Gemini<small>Server · API key · PDF + images</small></span>
        </label>
        <label class="mode-option">
          <input type="radio" name="extractMode" value="nano" />
          <span>On-device Nano<small>Chrome only · free · images</small></span>
        </label>
      </div>
      <div id="nanoStatus" class="nano-status" hidden></div>

      <div id="apiKeyBlock" class="api-key-block">
        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" placeholder="Bearer token or x-api-key value" autocomplete="off" />
      </div>

      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Choose files to upload">
        <strong>Tap or drop files here</strong>
        <span id="dropzoneHint">PDF or images · multiple files supported</span>
        <input id="fileInput" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.tif,.tiff,.bmp,image/*,application/pdf" hidden />
      </div>

      <div id="fileList" class="file-list"></div>

      <div class="actions">
        <button id="uploadBtn" class="primary" disabled>Upload &amp; extract</button>
        <button id="clearBtn" class="secondary" type="button">Clear queue</button>
      </div>
    </section>

    <section class="card">
      <div class="jobs-header">
        <h2>Jobs</h2>
        <small id="jobCount">0 active</small>
      </div>
      <div id="jobList" class="job-list">
        <div class="empty">No jobs yet. Upload a file to get started.</div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = 'ocr-extraction-api-key';
    const MODE_KEY = 'ocr-extraction-mode';
    const POLL_MS = 2000;
    const TERMINAL = new Set(['completed', 'failed']);
    const API_BASE = '/v1/jobs';
    const NANO_ACCEPT = '.jpg,.jpeg,.png,.webp,.gif,.bmp,image/jpeg,image/png,image/webp,image/gif,image/bmp';
    const CLOUD_ACCEPT =
      '.pdf,.jpg,.jpeg,.png,.webp,.gif,.tif,.tiff,.bmp,image/*,application/pdf';

    const EXTRACTION_PROMPT = [
      'You are an OCR extraction engine. Extract every distinct fact visible in this document.',
      '',
      'Rules:',
      '- Extract only what is visible. Never invent values, names, numbers, or dates.',
      '- If a value is unreadable or uncertain, omit that field.',
      '- Keep the original language and wording in values.',
      '- Keys must be snake_case, stable, and descriptive.',
      '- One field per distinct fact.',
      '- Put tabular data in tables, not as flattened fields.',
      '- confidence is 0 to 1 based on readability.',
      '- page is the 1-based page index, or 0 if unknown.',
      '- document_type is a short label (invoice, receipt, id, contract, letter, photo, etc.) or empty if unknown.',
      '- summary is one or two sentences describing the document.',
      '',
      'Return ONLY valid JSON with this shape:',
      '{"document_type":string|null,"summary":string,"fields":[{"key":string,"value":string,"description":string,"confidence":number,"page":number}],"tables":[{"name":string,"description":string,"headers":[string],"rows":[[string]],"page":number}]}',
    ].join('\n');

    const NANO_RESPONSE_SCHEMA = {
      type: 'object',
      properties: {
        document_type: { type: 'string' },
        summary: { type: 'string' },
        fields: {
          type: 'array',
          items: {
            type: 'object',
            properties: {
              key: { type: 'string' },
              value: { type: 'string' },
              description: { type: 'string' },
              confidence: { type: 'number' },
              page: { type: 'integer' },
            },
            required: ['key', 'value', 'description', 'confidence', 'page'],
          },
        },
        tables: {
          type: 'array',
          items: {
            type: 'object',
            properties: {
              name: { type: 'string' },
              description: { type: 'string' },
              headers: { type: 'array', items: { type: 'string' } },
              rows: {
                type: 'array',
                items: { type: 'array', items: { type: 'string' } },
              },
              page: { type: 'integer' },
            },
            required: ['name', 'description', 'headers', 'rows', 'page'],
          },
        },
      },
      required: ['document_type', 'summary', 'fields', 'tables'],
    };

    const apiKeyInput = document.getElementById('apiKey');
    const apiKeyBlock = document.getElementById('apiKeyBlock');
    const nanoStatusEl = document.getElementById('nanoStatus');
    const dropzoneHint = document.getElementById('dropzoneHint');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileListEl = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const jobListEl = document.getElementById('jobList');
    const jobCountEl = document.getElementById('jobCount');
    const toastEl = document.getElementById('toast');
    const modeInputs = [...document.querySelectorAll('input[name="extractMode"]')];

    let pendingFiles = [];
    /** @type {Map<string, { id: string, name: string, status: string, kind?: string, previewUrl?: string | null, result?: unknown, error?: string | null, processing_time_ms?: number | null, model?: string | null, usage?: { prompt_tokens: number, candidates_tokens: number, thoughts_tokens: number, total_tokens: number } | null, cost_usd?: number | null, pricing?: unknown, localStatus?: string, clientOnly?: boolean }>} */
    const jobs = new Map();
    let pollTimer = null;
    /** @type {any} */
    let nanoSession = null;
    let nanoAvailability = 'unavailable';
    /** @type {ReturnType<typeof setInterval> | null} */
    let nanoPollTimer = null;

    const NANO_INPUTS = [
      { type: 'text', languages: ['en'] },
      { type: 'image' },
    ];
    const NANO_OUTPUTS = [{ type: 'text', languages: ['en'] }];

    apiKeyInput.value = localStorage.getItem(STORAGE_KEY) || '';
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem(STORAGE_KEY, apiKeyInput.value.trim());
    });

    function getMode() {
      return modeInputs.find((el) => el.checked)?.value === 'nano' ? 'nano' : 'cloud';
    }

    function setMode(mode) {
      modeInputs.forEach((el) => {
        el.checked = el.value === mode;
      });
      localStorage.setItem(MODE_KEY, mode);
      syncModeUi();
    }

    function setNanoStatus(text, level) {
      nanoStatusEl.hidden = false;
      nanoStatusEl.textContent = text;
      nanoStatusEl.className = `nano-status ${level || ''}`.trim();
    }

    function stopNanoAvailabilityPoll() {
      if (nanoPollTimer) {
        clearInterval(nanoPollTimer);
        nanoPollTimer = null;
      }
    }

    function startNanoAvailabilityPoll() {
      if (nanoPollTimer) return;
      nanoPollTimer = setInterval(() => {
        if (getMode() !== 'nano') {
          stopNanoAvailabilityPoll();
          return;
        }
        refreshNanoAvailability({ quiet: true }).catch(() => {});
      }, 3000);
    }

    function syncModeUi() {
      const nano = getMode() === 'nano';
      apiKeyBlock.classList.toggle('hidden', nano);
      dropzoneHint.textContent = nano
        ? 'Images only · runs locally in Chrome (Gemini Nano)'
        : 'PDF or images · multiple files supported';
      fileInput.accept = nano ? NANO_ACCEPT : CLOUD_ACCEPT;
      uploadBtn.textContent = nano ? 'Extract on device' : 'Upload & extract';

      if (nano) {
        const before = pendingFiles.length;
        const kept = [];
        for (const entry of pendingFiles) {
          if (entry.kind === 'image') {
            kept.push(entry);
          } else {
            revokePreviewUrl(entry.previewUrl);
          }
        }
        pendingFiles = kept;
        if (before !== kept.length) {
          renderFiles();
          toast('Non-image files removed for on-device mode');
        }
        nanoStatusEl.hidden = false;
        refreshNanoAvailability();
      } else {
        stopNanoAvailabilityPoll();
        nanoStatusEl.hidden = true;
        destroyNanoSession();
      }
    }

    async function queryNanoAvailability(inputs = NANO_INPUTS) {
      return LanguageModel.availability({
        expectedInputs: inputs,
        expectedOutputs: NANO_OUTPUTS,
      });
    }

    async function tryCreateNanoSession(monitor) {
      const options = {
        expectedInputs: NANO_INPUTS,
        expectedOutputs: NANO_OUTPUTS,
      };
      if (typeof monitor === 'function') {
        options.monitor = monitor;
      }
      return LanguageModel.create(options);
    }

    async function diagnoseNanoCreateFailure(err) {
      let textOnly = 'unavailable';
      try {
        textOnly = await queryNanoAvailability([
          { type: 'text', languages: ['en'] },
        ]);
      } catch {
        /* ignore */
      }

      const detail = err?.message || String(err);
      if (textOnly === 'available' || textOnly === 'downloadable') {
        return (
          `${detail} Text Nano may work, but a vision/image session cannot start. ` +
          `In chrome://on-device-internals → Model Status, wait until "is already installing" is false, ` +
          `click Reset if needed, relaunch Chrome — or switch to Cloud for OCR.`
        );
      }
      return (
        `${detail} Model Status can show Ready while install is stuck ("is already installing"). ` +
        `Wait, Reset, relaunch Chrome, then retry — or switch to Cloud.`
      );
    }

    async function refreshNanoAvailability(opts = {}) {
      const quiet = Boolean(opts.quiet);
      const probe = opts.probe !== false && !quiet;

      if (!('LanguageModel' in self)) {
        nanoAvailability = 'unavailable';
        stopNanoAvailabilityPoll();
        setNanoStatus(
          'Gemini Nano is not available in this browser. Use Chrome 138+ (signed in, supported language), or switch to Cloud.',
          'err',
        );
        return nanoAvailability;
      }

      try {
        if (!quiet) setNanoStatus('Checking on-device model…', 'warn');

        const availability = await queryNanoAvailability();
        nanoAvailability = availability;

        if (availability === 'available') {
          stopNanoAvailabilityPoll();

          // availability() often lies while Chrome is still installing adaptations.
          // Only show "ready" after a real create() succeeds (or we already hold a session).
          if (nanoSession) {
            setNanoStatus('On-device Gemini Nano ready. Files stay in this browser.', 'ok');
            return nanoAvailability;
          }

          if (!probe) {
            setNanoStatus(
              'API reports available — will verify session on extract.',
              'warn',
            );
            return nanoAvailability;
          }

          setNanoStatus('Verifying vision session can start…', 'warn');
          try {
            nanoSession = await tryCreateNanoSession();
            setNanoStatus('On-device Gemini Nano ready. Files stay in this browser.', 'ok');
          } catch (err) {
            destroyNanoSession();
            nanoAvailability = 'unavailable';
            setNanoStatus(await diagnoseNanoCreateFailure(err), 'err');
          }
        } else if (availability === 'downloadable') {
          stopNanoAvailabilityPoll();
          setNanoStatus(
            'Model will download on first extract (one-time). Keep this tab open.',
            'warn',
          );
        } else if (availability === 'downloading') {
          setNanoStatus('Downloading Gemini Nano… keep this tab open.', 'warn');
          startNanoAvailabilityPoll();
        } else {
          stopNanoAvailabilityPoll();
          let textOnly = 'unavailable';
          try {
            textOnly = await queryNanoAvailability([
              { type: 'text', languages: ['en'] },
            ]);
          } catch {
            /* ignore */
          }

          if (textOnly !== 'unavailable') {
            setNanoStatus(
              'Text Nano works, but image/vision support is unavailable on this device. Use Cloud for OCR.',
              'err',
            );
          } else {
            setNanoStatus(
              'On-device model unavailable. Check chrome://on-device-internals → Model Status (watch "is already installing"), sign into Chrome — or switch to Cloud.',
              'err',
            );
          }
        }
      } catch (err) {
        nanoAvailability = 'unavailable';
        stopNanoAvailabilityPoll();
        setNanoStatus(
          `Could not check Nano: ${err?.message || err}. Switch to Cloud.`,
          'err',
        );
      }

      return nanoAvailability;
    }

    function destroyNanoSession() {
      try {
        nanoSession?.destroy?.();
      } catch {
        /* ignore */
      }
      nanoSession = null;
    }

    function downloadPercent(event) {
      // Chrome Prompt API: e.loaded is a 0..1 fraction (not bytes).
      const loaded = Number(event?.loaded);
      if (!Number.isFinite(loaded)) return null;
      if (loaded >= 0 && loaded <= 1) return Math.min(100, Math.round(loaded * 100));
      const total = Number(event?.total);
      if (Number.isFinite(total) && total > 0) {
        return Math.min(100, Math.round((loaded / total) * 100));
      }
      return null;
    }

    async function ensureNanoSession() {
      if (nanoSession) return nanoSession;
      if (!('LanguageModel' in self)) {
        throw new Error('LanguageModel API not supported in this browser');
      }

      const availability = await queryNanoAvailability();
      nanoAvailability = availability;

      if (availability === 'unavailable') {
        throw new Error(await diagnoseNanoCreateFailure(new Error('availability() is unavailable')));
      }

      setNanoStatus(
        availability === 'available'
          ? 'Starting Gemini Nano…'
          : 'Downloading Gemini Nano… keep this tab open.',
        'warn',
      );

      try {
        nanoSession = await tryCreateNanoSession((m) => {
          m.addEventListener('downloadprogress', (e) => {
            const pct = downloadPercent(e);
            if (pct == null) {
              setNanoStatus('Downloading Gemini Nano…', 'warn');
              return;
            }
            setNanoStatus(
              pct >= 100
                ? 'Download finished — loading model into memory…'
                : `Downloading Gemini Nano… ${pct}%`,
              'warn',
            );
          });
        });
      } catch (err) {
        destroyNanoSession();
        nanoAvailability = 'unavailable';
        const message = await diagnoseNanoCreateFailure(err);
        setNanoStatus(message, 'err');
        throw new Error(message);
      }

      stopNanoAvailabilityPoll();
      setNanoStatus('On-device Gemini Nano ready. Files stay in this browser.', 'ok');
      nanoAvailability = 'available';
      return nanoSession;
    }

    function parseNanoJson(raw) {
      const text = String(raw ?? '').trim();
      const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
      const candidate = (fenced ? fenced[1] : text).trim();
      try {
        return JSON.parse(candidate);
      } catch {
        const start = candidate.indexOf('{');
        const end = candidate.lastIndexOf('}');
        if (start >= 0 && end > start) {
          return JSON.parse(candidate.slice(start, end + 1));
        }
        throw new Error('Model did not return valid JSON');
      }
    }

    function normalizeNanoResult(parsed) {
      const fields = Array.isArray(parsed?.fields) ? parsed.fields : [];
      const tables = Array.isArray(parsed?.tables) ? parsed.tables : [];
      return {
        document_type:
          parsed?.document_type == null || parsed.document_type === ''
            ? null
            : String(parsed.document_type),
        summary: parsed?.summary == null ? '' : String(parsed.summary),
        fields: fields.map((f) => ({
          key: String(f?.key ?? ''),
          value: String(f?.value ?? ''),
          description: String(f?.description ?? ''),
          confidence: Math.min(1, Math.max(0, Number(f?.confidence) || 0)),
          page: f?.page == null || Number(f.page) <= 0 ? null : Math.trunc(Number(f.page)),
        })).filter((f) => f.key),
        tables: tables.map((t) => ({
          name: String(t?.name ?? 'table'),
          description: String(t?.description ?? ''),
          headers: Array.isArray(t?.headers) ? t.headers.map(String) : [],
          rows: Array.isArray(t?.rows)
            ? t.rows.map((row) => (Array.isArray(row) ? row.map(String) : []))
            : [],
          page: t?.page == null || Number(t.page) <= 0 ? null : Math.trunc(Number(t.page)),
        })),
      };
    }

    async function extractWithNano(entry) {
      const { file, kind, previewUrl } = entry;
      const jobId = `nano-${crypto.randomUUID()}`;
      const started = performance.now();

      jobs.set(jobId, {
        id: jobId,
        name: file.name,
        kind,
        previewUrl,
        status: 'processing',
        localStatus: 'processing',
        clientOnly: true,
        processing_time_ms: null,
        model: 'gemini-nano (chrome)',
        usage: null,
        cost_usd: null,
        pricing: {
          currency: 'USD',
          input_per_1m_usd: 0,
          output_per_1m_usd: 0,
          note: 'On-device Chrome Gemini Nano — no API cost',
        },
        error: null,
        result: null,
      });
      upsertJobCard(jobs.get(jobId));
      updateJobCount();

      try {
        if (kind !== 'image') {
          throw new Error('On-device mode supports images only (no PDF). Switch to Cloud for PDFs.');
        }

        const session = await ensureNanoSession();

        let raw;
        try {
          raw = await session.prompt(
            [
              {
                role: 'user',
                content: [
                  { type: 'text', value: EXTRACTION_PROMPT },
                  { type: 'image', value: file },
                ],
              },
            ],
            { responseConstraint: NANO_RESPONSE_SCHEMA },
          );
        } catch {
          raw = await session.prompt([
            {
              role: 'user',
              content: [
                { type: 'text', value: EXTRACTION_PROMPT },
                { type: 'image', value: file },
              ],
            },
          ]);
        }

        const result = normalizeNanoResult(parseNanoJson(raw));
        const elapsed = Math.round(performance.now() - started);

        jobs.set(jobId, {
          ...jobs.get(jobId),
          status: 'completed',
          localStatus: undefined,
          processing_time_ms: elapsed,
          cost_usd: 0,
          result,
          error: null,
        });
        upsertJobCard(jobs.get(jobId));
        updateJobCount();
      } catch (err) {
        destroyNanoSession();
        nanoAvailability = 'unavailable';
        jobs.set(jobId, {
          ...jobs.get(jobId),
          status: 'failed',
          localStatus: undefined,
          processing_time_ms: Math.round(performance.now() - started),
          error: err?.message ? String(err.message) : String(err),
        });
        upsertJobCard(jobs.get(jobId));
        updateJobCount();
      }
    }

    function authHeaders() {
      const key = apiKeyInput.value.trim();
      if (!key) throw new Error('API key is required');
      return {
        Authorization: `Bearer ${key}`,
        'X-API-Key': key,
      };
    }

    function isPdf(file) {
      return file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    }

    function isImage(file) {
      return (
        file.type.startsWith('image/') ||
        /\.(jpe?g|png|webp|gif|tiff?|bmp)$/i.test(file.name)
      );
    }

    function fileKind(file) {
      if (isPdf(file)) return 'pdf';
      if (isImage(file)) return 'image';
      return 'doc';
    }

    function pdfIconHtml() {
      return `<div class="thumb thumb-doc" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <path d="M8 13h8M8 17h5" stroke-linecap="round"></path>
        </svg>
      </div>`;
    }

    function docIconHtml() {
      return `<div class="thumb thumb-doc" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
      </div>`;
    }

    function renderThumbHtml(kind, previewUrl, name) {
      if (kind === 'image' && previewUrl) {
        return `<div class="thumb"><img src="${previewUrl}" alt="Preview of ${escapeHtml(name)}" loading="lazy" /></div>`;
      }
      if (kind === 'pdf') return pdfIconHtml();
      return docIconHtml();
    }

    function revokePreviewUrl(url) {
      if (url) URL.revokeObjectURL(url);
    }

    function enqueueFile(file) {
      const kind = fileKind(file);
      const previewUrl = kind === 'image' ? URL.createObjectURL(file) : null;
      pendingFiles.push({ file, kind, previewUrl });
    }

    function clearPendingFiles() {
      pendingFiles.forEach((entry) => revokePreviewUrl(entry.previewUrl));
      pendingFiles = [];
    }

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    function formatMs(ms) {
      if (ms == null || !Number.isFinite(ms)) return null;
      if (ms < 1000) return `${Math.round(ms)}ms`;
      return `${(ms / 1000).toFixed(1)}s`;
    }

    function formatUsd(value) {
      if (value == null || !Number.isFinite(value)) return null;
      if (value < 0.01) return `$${value.toFixed(6)}`;
      return `$${value.toFixed(4)}`;
    }

    function formatJobMetaLine(job) {
      const parts = [job.id];
      if (job.model) parts.push(job.model);
      const duration = formatMs(job.processing_time_ms);
      if (duration) parts.push(duration);
      if (job.usage?.total_tokens != null) {
        parts.push(`${job.usage.total_tokens.toLocaleString()} tokens`);
      }
      if (job.clientOnly && job.status === 'completed') {
        parts.push('free');
      } else {
        const cost = formatUsd(job.cost_usd);
        if (cost) parts.push(`~${cost}`);
      }
      return parts.join(' · ');
    }

    function renderFiles() {
      fileListEl.innerHTML = '';
      pendingFiles.forEach((entry, index) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';

        const main = document.createElement('div');
        main.className = 'file-chip-main';
        main.innerHTML = `${renderThumbHtml(entry.kind, entry.previewUrl, entry.file.name)}<span>${escapeHtml(entry.file.name)}</span>`;

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.setAttribute('aria-label', 'Remove file');
        remove.textContent = '×';
        remove.onclick = () => {
          revokePreviewUrl(pendingFiles[index].previewUrl);
          pendingFiles.splice(index, 1);
          renderFiles();
        };

        chip.appendChild(main);
        chip.appendChild(remove);
        fileListEl.appendChild(chip);
      });
      uploadBtn.disabled = pendingFiles.length === 0;
    }

    function escapeHtml(value) {
      return value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function badgeClass(status) {
      return `badge ${status}`;
    }

    function buildJobCardShell(job) {
      const status = job.localStatus || job.status;
      const article = document.createElement('article');
      article.className = 'job-card';
      article.dataset.id = job.id;
      article.innerHTML = `
        <div class="job-top">
          <div class="job-body">
            ${renderThumbHtml(job.kind || 'doc', job.previewUrl, job.name)}
            <div class="job-info">
              <div class="job-name">${escapeHtml(job.name)}</div>
              <div class="job-meta">${escapeHtml(formatJobMetaLine(job))}</div>
            </div>
          </div>
          <span class="${badgeClass(status)}">${status}</span>
        </div>
      `;
      syncErrorBlock(article, job);
      syncResultBlock(article, job);
      return article;
    }

    function syncErrorBlock(card, job) {
      let errorEl = card.querySelector('.job-error');
      if (!job.error) {
        errorEl?.remove();
        return;
      }
      if (!errorEl) {
        errorEl = document.createElement('div');
        errorEl.className = 'job-error';
        const resultEl = card.querySelector('.job-result');
        if (resultEl) {
          card.insertBefore(errorEl, resultEl);
        } else {
          card.appendChild(errorEl);
        }
      }
      errorEl.textContent = job.error;
    }

    function syncResultBlock(card, job) {
      let details = card.querySelector('.job-result');
      if (!job.result) {
        details?.remove();
        return;
      }

      const display =
        job.processing_time_ms != null || job.usage
          ? {
              ...job.result,
              meta: {
                processing_time_ms: job.processing_time_ms,
                model: job.model,
                usage: job.usage,
                cost_usd: job.cost_usd,
                pricing: job.pricing,
              },
            }
          : job.result;
      const json = JSON.stringify(display, null, 2);
      if (!details) {
        details = document.createElement('details');
        details.className = 'job-result';
        details.innerHTML =
          '<summary>View extraction result</summary><div class="result-panel"><pre></pre></div>';
        card.appendChild(details);
      }

      const pre = details.querySelector('pre');
      if (pre && pre.textContent !== json) {
        const wasOpen = details.open;
        const scrollTop = pre.scrollTop;
        pre.textContent = json;
        details.open = wasOpen;
        pre.scrollTop = scrollTop;
      }
    }

    function updateJobCount() {
      const items = [...jobs.values()];
      const active = items.filter((j) => !TERMINAL.has(j.status)).length;
      jobCountEl.textContent = `${active} active · ${items.length} total`;

      if (items.length === 0) {
        jobListEl.innerHTML =
          '<div class="empty">No jobs yet. Upload a file to get started.</div>';
      }
    }

    function upsertJobCard(job) {
      jobListEl.querySelector('.empty')?.remove();

      let card = jobListEl.querySelector(`[data-id="${job.id}"]`);
      if (!card) {
        card = buildJobCardShell(job);
        jobListEl.prepend(card);
        return;
      }

      updateJobCard(card, job);
    }

    function updateJobCard(card, job) {
      const status = job.localStatus || job.status;
      const badge = card.querySelector('.badge');
      if (badge) {
        badge.className = badgeClass(status);
        badge.textContent = status;
      }

      const meta = card.querySelector('.job-meta');
      if (meta) {
        meta.textContent = formatJobMetaLine(job);
      }

      syncErrorBlock(card, job);
      syncResultBlock(card, job);
    }

    function removeJobCard(jobId) {
      jobListEl.querySelector(`[data-id="${jobId}"]`)?.remove();
      updateJobCount();
    }

    function addFiles(files) {
      const accepted = [...files].filter(Boolean);
      if (!accepted.length) return;

      if (getMode() === 'nano') {
        const images = accepted.filter(isImage);
        const skipped = accepted.length - images.length;
        if (skipped > 0) {
          toast(`${skipped} PDF/non-image file(s) skipped in on-device mode`);
        }
        if (!images.length) {
          toast('On-device mode supports images only');
          return;
        }
        images.forEach(enqueueFile);
      } else {
        accepted.forEach(enqueueFile);
      }
      renderFiles();
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });
    fileInput.addEventListener('change', () => {
      addFiles(fileInput.files);
      fileInput.value = '';
    });

    ['dragenter', 'dragover'].forEach((type) => {
      dropzone.addEventListener(type, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });
    ['dragleave', 'drop'].forEach((type) => {
      dropzone.addEventListener(type, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });
    dropzone.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));

    clearBtn.addEventListener('click', () => {
      clearPendingFiles();
      renderFiles();
    });

    async function createJob(entry) {
      const { file, kind, previewUrl } = entry;
      const tempId = crypto.randomUUID();
      jobs.set(tempId, {
        id: tempId,
        name: file.name,
        kind,
        previewUrl,
        status: 'uploading',
        localStatus: 'uploading',
        processing_time_ms: null,
        model: null,
        usage: null,
        cost_usd: null,
        pricing: null,
        error: null,
        result: null,
      });
      upsertJobCard(jobs.get(tempId));
      updateJobCount();

      const body = new FormData();
      body.append('file', file);

      const response = await fetch(API_BASE, {
        method: 'POST',
        headers: authHeaders(),
        body,
      });

      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const message = payload.message || payload.error || `Upload failed (${response.status})`;
        jobs.set(tempId, {
          ...jobs.get(tempId),
          status: 'failed',
          localStatus: undefined,
          error: Array.isArray(message) ? message.join(', ') : String(message),
        });
        upsertJobCard(jobs.get(tempId));
        updateJobCount();
        return;
      }

      const card = jobListEl.querySelector(`[data-id="${tempId}"]`);
      jobs.delete(tempId);
      jobs.set(payload.job_id, {
        id: payload.job_id,
        name: file.name,
        kind,
        previewUrl,
        status: payload.status,
        processing_time_ms: payload.processing_time_ms,
        model: payload.model ?? null,
        usage: payload.usage ?? null,
        cost_usd: payload.cost_usd ?? null,
        pricing: payload.pricing ?? null,
        error: payload.error,
        result: payload.result,
      });

      const saved = jobs.get(payload.job_id);
      if (card && saved) {
        card.dataset.id = payload.job_id;
        updateJobCard(card, saved);
      } else if (saved) {
        upsertJobCard(saved);
      }
      updateJobCount();
      schedulePoll();
    }

    uploadBtn.addEventListener('click', async () => {
      if (!pendingFiles.length) return;

      const mode = getMode();

      if (mode === 'cloud') {
        try {
          authHeaders();
        } catch {
          toast('Enter your API key first');
          apiKeyInput.focus();
          return;
        }
      } else if (nanoAvailability === 'unavailable') {
        toast('On-device Nano unavailable — switch to Cloud or use Chrome 138+');
        return;
      }

      const batch = pendingFiles.splice(0);
      renderFiles();
      uploadBtn.disabled = true;

      if (mode === 'nano') {
        // Sequential keeps Nano session stable and avoids GPU contention.
        for (const entry of batch) {
          await extractWithNano(entry);
        }
      } else {
        await Promise.allSettled(batch.map((entry) => createJob(entry)));
      }

      uploadBtn.disabled = pendingFiles.length === 0;
    });

    async function refreshJob(jobId) {
      const response = await fetch(`${API_BASE}/${jobId}`, {
        headers: authHeaders(),
      });
      if (response.status === 404) {
        jobs.delete(jobId);
        removeJobCard(jobId);
        return true;
      }
      if (!response.ok) return false;

      const payload = await response.json();
      const existing = jobs.get(jobId);
      if (!existing) return false;

      const next = {
        ...existing,
        status: payload.status,
        localStatus: undefined,
        processing_time_ms: payload.processing_time_ms,
        model: payload.model ?? null,
        usage: payload.usage ?? null,
        cost_usd: payload.cost_usd ?? null,
        pricing: payload.pricing ?? null,
        error: payload.error,
        result: payload.result,
      };

      const changed =
        next.status !== existing.status ||
        next.processing_time_ms !== existing.processing_time_ms ||
        next.cost_usd !== existing.cost_usd ||
        next.usage?.total_tokens !== existing.usage?.total_tokens ||
        next.error !== existing.error ||
        next.result !== existing.result;

      if (!changed) return false;

      jobs.set(jobId, next);
      const card = jobListEl.querySelector(`[data-id="${jobId}"]`);
      if (card) {
        updateJobCard(card, next);
      }
      updateJobCount();
      return true;
    }

    async function pollJobs() {
      const activeIds = [...jobs.values()]
        .filter(
          (j) =>
            !j.clientOnly &&
            !TERMINAL.has(j.status) &&
            j.localStatus !== 'uploading',
        )
        .map((j) => j.id);

      if (!activeIds.length) {
        stopPoll();
        return;
      }

      try {
        authHeaders();
      } catch {
        stopPoll();
        return;
      }

      await Promise.allSettled(activeIds.map((id) => refreshJob(id)));
    }

    function schedulePoll() {
      if (pollTimer) return;
      pollTimer = setInterval(() => {
        pollJobs().catch(() => {});
      }, POLL_MS);
      pollJobs().catch(() => {});
    }

    function stopPoll() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    modeInputs.forEach((input) => {
      input.addEventListener('change', () => {
        if (!input.checked) return;
        localStorage.setItem(MODE_KEY, input.value);
        syncModeUi();
      });
    });

    const savedMode = localStorage.getItem(MODE_KEY);
    if (savedMode === 'nano' || savedMode === 'cloud') {
      setMode(savedMode);
    } else {
      syncModeUi();
    }
  </script>
</body>
</html>
